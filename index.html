<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odin - Rock Paper Scissors</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", serif;
      background-color: #2B2F3A;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      color: #d1d1d1;
    }

    h1 {
      color: #EAEAEA;
      padding-bottom: 2rem;
    }

    main {
      background: #3A3F4B;
      padding: 2rem;
      border-radius: 8px;
      width: 50vw;
    }

    .scoreboard-container {
      display: flex;
      align-items: center;
      flex-direction: column;
      width: 100%;
    }

    .scoreboard-container p {
      text-align: right;
      align-self: flex-end;
    }

    .button-container {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 1rem;
    }

    .button-container button {
      padding: 1.5rem;
      border-radius: 4px;
      outline: none;
      border: none;
      background: #7A8B94;
      cursor: pointer;
      font-size: 1.5em;
      color: #1C2630;
    }

    .choice-container {
      padding: 1rem;
      text-align: center;
    }

    #result {
      text-align: center;
      background: #7A8B94;
      padding: 1rem .5rem;
      width: 200px;
      margin: 1rem auto;
      font-weight: 700;
      font-size: 1.2em;
    }
  </style>
</head>

<body>
  <h1>Rock Paper Scissors!</h1>
  <main id="container">
    <div class="scoreboard-container">
      <p id="playerScore">Player: 0</p>
      <p id="computerScore">Computer: 0</p>
    </div>
    <div class="button-container">
      <button class="button-pick" id="btnRock" aria-label="rock">
        <i class="fa-solid fa-hand-back-fist"></i>
      </button>
      <button class="button-pick" id="btnPaper" aria-label="paper">
        <i class="fa-solid fa-hand"></i>
      </button>
      <button class="button-pick" id="btnScissors" aria-label="scissors">
        <i class="fa-solid fa-hand-scissors"></i>
      </button>
    </div>

    <div class="choice-container">
      <p id="playerChoice">Player Choice: </p>
      <p id="computerChoice">Computer Choice: </p>
    </div>

    <p id="result">RESULT</p>
  </main>
  <script>
    class Player {
      constructor() {
        this.score = 0;
        this.choice = '';
      }

      updateScore() {
        this.score++;
      }
      setScore(score) {
        this.score = score;
      }
      updateChoice(choice) {
        this.choice = choice;
      }

      getScore() {
        return this.score;
      }
      getChoice() {
        return this.choice;
      }
    }

    class GameManager {
      constructor() {
        this.result = '';
        this.computer = new Player();
        this.player = new Player();
      }

      setComputerChoice() {
        let choices = ['rock', 'paper', 'scissors'];
        let index = Math.floor(Math.random() * choices.length);
        this.computer.updateChoice(choices[index]);
      }

      setPlayerChoice(choice) {
        this.player.updateChoice(choice);
      }

      playRound() {
        let playerChoice = this.player.getChoice();
        let computerChoice = this.computer.getChoice();
        if (
          (playerChoice === 'rock' && computerChoice === 'rock') ||
          (playerChoice === 'paper' && computerChoice === 'paper') ||
          (playerChoice === 'scissors' && computerChoice === 'scissors')
        ) {
          this.result = 'Tied';
        } else if (
          (playerChoice === 'rock' && computerChoice === 'paper') ||
          (playerChoice === 'paper' && computerChoice === 'scissors') ||
          (playerChoice === 'scissors' && computerChoice === 'rock')
        ) {
          this.result = 'Computer Win';
          this.computer.updateScore();
        } else {
          this.result = 'Player Win';
          this.player.updateScore();
        }
        document.querySelector('#playerChoice').innerText = `Player Choice: ${playerChoice}`;
        document.querySelector('#computerChoice').innerText = `Computer Choice: ${computerChoice}`;
        document.querySelector('#result').innerText = this.result;
        document.querySelector('#playerScore').innerText = `Player: ${this.player.getScore()}`;
        document.querySelector('#computerScore').innerText = `Computer: ${this.computer.getScore()}`;
      }

      playGame() {
        if (this.player.getScore() === 5 || this.computer.getScore() === 5) {
          alert('The Game Finish');
          this.player.setScore(0);
          this.computer.setScore(0);

          document.querySelector('#playerScore').innerText = `Player: ${this.player.getScore()}`;
          document.querySelector('#computerScore').innerText = `Computer: ${this.computer.getScore()}`;
          document.querySelector('#result').innerText = "New Game Started!";
          return;
        }
        this.setComputerChoice();
        this.playRound();
      }
    }
    const game1 = new GameManager();

    const button = document.querySelectorAll('.button-pick');
    button.forEach(btn => {
      btn.addEventListener('click', (e) => {
        let playerChoice = e.currentTarget.getAttribute("aria-label");
        game1.setPlayerChoice(playerChoice);
        game1.playGame();
      });
    });
  </script>
</body>

</html>
